# Combined toolset: image_zoom_in_tool (crop/zoom) + the five drawing tools
# (draw_points / draw_lines / draw_boxes / draw_texts / draw_polygons).
# Registering zoom alongside draw keeps the zoom-trained checkpoint's reflexive
# image_zoom_in_tool calls productive (a draw-only list would terminate the
# trajectory on those, tool_agent_loop.py:1438) while giving the model the new
# drawing ability. The tools: list supports multiple entries; the model picks
# which tool to call each turn. All coordinates use the 0-1000 normalized scale.
tools:
  - class_name: verl.tools.image_zoom_in_tool.ImageZoomInTool
    config:
      type: native
      num_workers: 20
      rate_limit: 50
      timeout: 30
      enable_global_rate_limit: true
      coordinate_system: normalized_1000
      cropped_min_pixels: 518400
      cropped_max_pixels: 1048576
      use_original_resolution_source: true
      original_source_unavailable_policy: fallback
      # Multi-index variant: after each zoom, register the crop as a NEW addressable
      # img_idx and tell the model it can zoom into it. Mirrors the vero_eval task
      # visual_probe_hard_reasoning_zoom_multiidx (image_indexing: multi_index). The
      # default ("training_faithful") reproduces the step-403 training behavior, where
      # the response never announced a new index (581/581 calls used img_idx 0).
      image_indexing: multi_index
    tool_schema:
      type: function
      function:
        name: image_zoom_in_tool
        description: Zoom in on a specific region of an image by cropping it based on a bounding box (bbox) and an optional object label
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items:
                type: number
              minItems: 4
              maxItems: 4
              description: The bounding box of the region to zoom in, as [x1, y1, x2, y2], where (x1, y1) is the top-left corner and (x2, y2) is the bottom-right corner
            label:
              type: string
              description: The name or label of the object in the specified bounding box
            img_idx:
              type: number
              description: The index of the zoomed-in image (starting from 0)
          required: ["bbox_2d", "label", "img_idx"]


  # --- Drawing tools (Haoyang's verl.tools.image_drawing_tools.*): render via the
  # eval Visualizer for exact train/eval pixel parity. Each returns the annotated
  # image (appended as a new img_idx) + a crop_image_ref for lazy multimodal rebuild.
  - class_name: verl.tools.image_drawing_tools.DrawPointsTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: draw_points
        description: "Draw one or more point markers on an image. Coordinates use 0-1000 scale where (0,0)=top-left, (1000,1000)=bottom-right. For a single point, pass [x, y]. For multiple points, pass [[x1, y1], [x2, y2], ...]. Example: draw_points(img_idx=0, points=[[500, 500], [600, 600]]) draws 2 points."
        parameters:
          type: object
          properties:
            img_idx:
              type: integer
              description: "Index of the image to draw on (0-based)."
            points:
              type: array
              description: "Either [x, y] for a single point, or [[x1, y1], [x2, y2], ...] for multiple points. Coordinates use 0-1000 scale."
            color:
              type: string
              description: "Color name for markers."
              default: "lime"
            radius:
              type: integer
              description: "Radius of the circle markers (0-1000, relative to image width)."
              default: 15
          required: ["img_idx", "points"]

  - class_name: verl.tools.image_drawing_tools.DrawLinesTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: draw_lines
        description: "Draw one or more lines on an image. Coordinates use 0-1000 scale. For a single line, pass [x1, y1, x2, y2]. For multiple lines, pass [[x1, y1, x2, y2], [x1, y1, x2, y2], ...]. Example: draw_lines(img_idx=0, lines=[[200, 300, 800, 700]]) draws one diagonal line."
        parameters:
          type: object
          properties:
            img_idx:
              type: integer
              description: "Index of the image to draw on (0-based)."
            lines:
              type: array
              description: "Either [x1, y1, x2, y2] for a single line, or [[x1, y1, x2, y2], ...] for multiple lines. Coordinates use 0-1000 scale."
            color:
              type: string
              description: "Color name."
              default: "red"
            linewidth:
              type: number
              description: "Width of the lines in pixels."
              default: 3
          required: ["img_idx", "lines"]

  - class_name: verl.tools.image_drawing_tools.DrawBoxesTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: draw_boxes
        description: "Draw one or more bounding boxes on an image. Coordinates use 0-1000 scale where (0,0)=top-left, (1000,1000)=bottom-right. For a single box, pass [x1, y1, x2, y2]. For multiple boxes, pass [[x1, y1, x2, y2], ...]. Example: draw_boxes(img_idx=0, boxes=[[100, 100, 200, 200], [300, 300, 400, 400]]) draws 2 boxes."
        parameters:
          type: object
          properties:
            img_idx:
              type: integer
              description: "Index of the image to draw on (0-based)."
            boxes:
              type: array
              description: "Either [x1, y1, x2, y2] for a single box, or [[x1, y1, x2, y2], ...] for multiple boxes. Coordinates use 0-1000 scale."
            color:
              type: string
              description: "Color name for all boxes (e.g., 'lime', 'red', 'blue')."
              default: "lime"
            alpha:
              type: number
              description: "Opacity of the box outlines."
              default: 0.8
            linewidth:
              type: integer
              description: "Width of box outlines in pixels."
              default: 3
          required: ["img_idx", "boxes"]

  - class_name: verl.tools.image_drawing_tools.DrawTextsTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: draw_texts
        description: "Add one or more text annotations to an image. Coordinates use 0-1000 scale. For a single text, pass {\"x\": x, \"y\": y, \"text\": \"label\"}. For multiple, pass a list. Example: draw_texts(img_idx=0, texts=[{\"x\": 500, \"y\": 100, \"text\": \"Title\"}]) adds text at top center."
        parameters:
          type: object
          properties:
            img_idx:
              type: integer
              description: "Index of the image to draw on (0-based)."
            texts:
              type: array
              description: "Either {\"x\": x, \"y\": y, \"text\": \"label\"} for a single text, or a list of such dicts for multiple texts. Coordinates use 0-1000 scale."
            color:
              type: string
              description: "Text color name."
              default: "red"
            font_size:
              type: integer
              description: "Size of the font in pixels."
              default: 18
          required: ["img_idx", "texts"]

  - class_name: verl.tools.image_drawing_tools.DrawPolygonsTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: draw_polygons
        description: "Draw one or more polygons on an image. Coordinates use 0-1000 scale. For a single polygon, pass [[x1,y1], [x2,y2], [x3,y3], ...]. For multiple polygons, pass [[[x1,y1], ...], [[x1,y1], ...], ...]. Example: draw_polygons(img_idx=0, polygons=[[[200,200], [800,200], [500,800]]]) draws a triangle."
        parameters:
          type: object
          properties:
            img_idx:
              type: integer
              description: "Index of the image to draw on (0-based)."
            polygons:
              type: array
              description: "Either [[x1,y1], [x2,y2], ...] for a single polygon, or [[[x1,y1], ...], [[x1,y1], ...]] for multiple polygons. Coordinates use 0-1000 scale."
            color:
              type: string
              description: "Color name."
              default: "red"
            alpha:
              type: number
              description: "Opacity of the fill."
              default: 0.5
          required: ["img_idx", "polygons"]
