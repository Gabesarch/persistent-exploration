# Gemma4 E4B native-thinking version of gdpo_fresh_lr1e5_noexplore_accformat.
# Keep natural tool use, accuracy/format GDPO only, and no retries/branches/critic.
# Strict native <answer> finals; the smoke-only accuracy relaxation is not enabled.
defaults:
- ppo_trainer
- _self_
hydra:
  searchpath:
  - file://${oc.env:VERL_ROOT}/verl/trainer/config
algorithm:
  adv_estimator: gdpo
  gdpo_reward_keys:
  - accuracy
  - format
  gdpo_reward_weights:
  - 0.8
  - 0.2
  gdpo_reward_eligibility: {}
  gdpo_baseline_weight_key: null
  gdpo_stability_enabled: true
  gdpo_component_std_floor: 0.05
  gdpo_component_adv_clip: 5.0
  gdpo_final_std_floor: 0.05
  gdpo_final_adv_clip: 10.0
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0
data:
  train_files: /scratch/gpfs/ZHUANGL/gs1693/vero2_datasets/train_rl_datasets/chart_search_counting_visual_probe_train_rollout_score_leq05_all.verl.jsonl
  val_files: /scratch/gpfs/ZHUANGL/gs1693/vero2/datasets/visual_probe_easy_medium_hard_validation/visual_probe_easy_medium_hard_val.verl.jsonl
  filter_overlong_prompts_workers: 64
  image_root: ${oc.env:IMAGE_ROOT}
  system_prompt: ${oc.env:VERL_ROOT}/vero_eval/prompts/tools/system_gemma_zoom.txt
  shuffle: true
  train_batch_size: 128
  val_batch_size: 128
  max_prompt_length: 16384
  max_response_length: 24576
  max_pixels: null
  filter_overlong_prompts: false
  truncation: error
  image_key: images
  prompt_key: prompt
  add_fixation_post_prompt: false
  normalize_bbox_to_1000: true
  return_raw_chat: true
  return_multi_modal_inputs: false
  tool_config_path: ${oc.env:VERL_ROOT}/vero2_scripts/config/tool_config/gemma4_image_zoom_in_tool.yaml
  per_batch_domain_weights:
    chart: 1
    counting: 1
    search: 1
  custom_cls:
    path: ${oc.env:VERL_ROOT}/verl/utils/dataset/gemma4_dataset.py
    name: Gemma4Dataset
  apply_chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
actor_rollout_ref:
  model:
    path: ${oc.env:HF_HOME}/google/gemma-4-E4B-it
    custom_chat_template: null
    use_remove_padding: false
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_fused_kernels: false
    use_liger: false
    override_config:
      attn_implementation: sdpa
  actor:
    optim:
      lr: 1e-5
      lr_warmup_steps: 10
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    ulysses_sequence_parallel_size: 1
    # Image/crop memory is not bounded by the text-token packing budget.
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 49296
    loss_agg_mode: seq-mean-token-mean
    policy_loss:
      loss_mode: gspo
      retry_critic:
        enabled: false
      branch_strata:
        enabled: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    clip_ratio_low: 0.0003
    clip_ratio_high: 0.0004
    clip_ratio_c: 10.0
    entropy_coeff: 0
    entropy_from_logits_with_chunking: true
    strategy: fsdp2
    freeze_vision_tower: false
    use_torch_compile: false
    fsdp_config:
      strategy: fsdp2
      model_dtype: bfloat16
      dtype: bfloat16
      fsdp_size: 8
      reshard_after_forward: true
      entropy_checkpointing: false
      offload_policy: false
      param_offload: false
      optimizer_offload: false
      forward_prefetch: false
      cast_forward_inputs: false
      sync_buffers_by_name: true
      gemma4_group_text_layers: true
      gemma4_position_embedding_lookup: true
      gemma4_policy_chunk_size: 128
      gemma4_skip_log_prob_entropy: true
      freeze_audio_tower: true
      wrap_policy:
        transformer_layer_cls_to_wrap:
        - Gemma4TextDecoderLayer
        - Gemma4VisionEncoderLayer
  rollout:
    name: vllm
    mode: async
    lazy_multi_modal_inputs:
      enabled: true
      assert_metadata_match: true
      crop_cache_root: ${oc.env:VERO2_CROP_CACHE_ROOT}
      cleanup_crop_cache: true
    agent:
      num_workers: 8
      default_agent_loop: gemma4_tool_agent
      agent_loop_config_path: ${oc.env:VERL_ROOT}/vero2_scripts/config/gemma4_agents.yaml
    multi_turn:
      enable: true
      tool_config_path: ${data.tool_config_path}
      max_assistant_turns: 11
      max_assistant_tokens_per_turn: 4096
      max_user_turns: 10
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      format: gemma4
      force_tool_calls_until_final_turn: false
      force_answer_on_final_turn: true
      force_answer_on_final_turn_validation: true
      force_final_answer_think_prefill: This is the final turn, so I need to answer
        from the evidence gathered so far.
      final_answer_token_margin: 2048
      tool_response_turn_suffix_enabled: false
      conditional_answer_retry_enabled: false
      conditional_answer_retry_enable_validation: false
      conditional_answer_retry_force_next_tool_call: false
      conditional_answer_retry_suffix: ''
      conditional_answer_retry_assistant_prefill: ''
      conditional_answer_retry_branch_enabled: false
      conditional_answer_retry_branch_enable_validation: false
      conditional_answer_retry_critic_enabled: false
      conditional_answer_retry_critic_oracle_supervision_enabled: false
      conditional_answer_retry_critic_enable_validation: false
      llm_judge_enabled: true
      llm_judge_prompt_path: ${oc.env:VERL_ROOT}/vero2_scripts/prompts/llm_judge_visual_search_prompt.txt
      llm_judge_reward_types:
      - search
      llm_judge_assistant_prefill: '{'
      llm_judge_max_tokens: 48
      llm_judge_temperature: 0.0
      llm_judge_top_p: 1.0
      llm_judge_partial_credit_score: 0.5
      llm_judge_timeout_s: null
      llm_judge_fallback_to_string_reward: true
    tensor_model_parallel_size: 1
    ignore_eos: false
    disable_log_stats: false
    dtype: bfloat16
    engine_kwargs:
      vllm:
        mm_processor_cache_gb: 0
        mm_processor_kwargs:
          max_soft_tokens: 1120
        limit_mm_per_prompt:
          image: 11
          audio: 0
          video: 0
    gpu_memory_utilization: 0.6
    enable_prefix_caching: false
    max_model_len: 40960
    max_num_batched_tokens: 8192
    max_num_seqs: 728
    enable_chunked_prefill: true
    enforce_eager: false
    free_cache_engine: true
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 8
    val_kwargs:
      temperature: 0.7
      top_p: 1.0
      top_k: -1
      do_sample: true
      n: 1
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 49296
    checkpoint_engine:
      update_weights_bucket_megabytes: 6144
    gemma4_preserve_constant_norm_weights: true
  ref:
    strategy: fsdp2
    ulysses_sequence_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 49296
    entropy_from_logits_with_chunking: true
    use_torch_compile: false
    fsdp_config:
      strategy: fsdp2
      model_dtype: bfloat16
      reshard_after_forward: true
      offload_policy: false
      param_offload: false
      cast_forward_inputs: false
      sync_buffers_by_name: true
      gemma4_group_text_layers: true
      gemma4_position_embedding_lookup: true
      gemma4_policy_chunk_size: 128
      freeze_audio_tower: true
      wrap_policy:
        transformer_layer_cls_to_wrap:
        - Gemma4TextDecoderLayer
        - Gemma4VisionEncoderLayer
reward:
  reward_manager:
    name: dapo
  custom_reward_function:
    path: ${oc.env:VERL_ROOT}/verl/utils/reward_score/gemma4_native.py
    name: async_compute_score_from_data_source
    reward_kwargs:
      format_score: 0.1
      min_tool_calls_for_bonus: null
      tool_call_bonus: 0.0
      tool_efficiency_reward_mode: concave_length_penalty
      tool_efficiency_free_calls: 1
      tool_efficiency_concave_k: 10.0
      tool_efficiency_concave_q: 0.85
      tool_repeat_overlap_iou_threshold: 0.9
      tool_repeat_overlap_small_crop_area_threshold: 0.0002
      tool_repeat_overlap_repeat_weight: 1.0
      tool_repeat_overlap_small_crop_weight: 0.5
      tool_repeat_overlap_free_depth_refinements: 2
      tool_repeat_overlap_depth_containment_threshold: 0.95
      tool_repeat_overlap_excess_depth_weight: 0.5
      allow_unboxed_answer_for_accuracy: true
      require_boxed_answer_for_full_format: false
      unboxed_answer_format_score: 1.0
  reward_kwargs:
    overlong_buffer_cfg:
      enable: true
      len: 2048
      penalty_factor: 1.0
      log: false
    max_resp_len: ${data.max_response_length}
    reward_response_prefix: ''
    skip_special_tokens: false
critic:
  enable: false
  ulysses_sequence_parallel_size: 1
  use_dynamic_bsz: true
  ppo_max_token_len_per_gpu: 49296
  forward_max_token_len_per_gpu: 49296
  forward_micro_batch_size_per_gpu: 16
trainer:
  critic_warmup: 0
  logger:
  - console
  - wandb
  save_freq: 10
  test_freq: 10
  nnodes: 1
  n_gpus_per_node: 8
  project_name: vero2_verl
  experiment_name: gdpo_fresh_lr1e5_noexplore_accformat_gemma4_e4b
  total_epochs: 1000
  total_training_steps: 200
  log_val_generations: 0
  esi_redundant_time: 2000
  resume_mode: auto
  resume_from_path: null
  bootstrap_from_path: null
  val_before_train: false
  use_legacy_worker_impl: enable
  default_local_dir: ${oc.env:SAVE_PATH}/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  validation_data_dir: ${trainer.default_local_dir}/validation_data
  save_validation_crops: true
  comprehensive_debug_logging:
    enabled: true
    dir: ${trainer.default_local_dir}/debug_logs
    log_every_n_steps: 5
    save_cropped_images: false
    save_source_images: false
    max_text_chars: null
    gpu_memory_logging:
      enabled: false
      sync_cuda: false
      reset_peak_stats: true
      log_driver_stages: true
      log_worker_stages: true
      log_nvidia_smi: true
