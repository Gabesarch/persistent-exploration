dataset_path: m-Just/O3-Bench
dataset_kwargs:
  builder_fn: !function utils.o3_bench_builder
task: o3_bench
test_split: test
output_type: generate_until
doc_to_visual: !function utils.o3_bench_doc_to_visual
doc_to_text: !function utils.o3_bench_doc_to_text
doc_to_target: !function utils.o3_bench_doc_to_target
process_results: !function utils.o3_bench_process_results
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.o3_bench_aggregate_results
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  do_sample: false
metadata:
  version: 1.0
