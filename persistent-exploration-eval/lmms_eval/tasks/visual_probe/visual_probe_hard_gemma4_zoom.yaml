# Normal, autonomous Gemma zoom; shared dataset and judge with the Qwen/Vero tasks.
include:
  - visual_probe_hard.yaml
  - ../_tool_templates/_toolset_zoom_gemma_yaml
task: visual_probe_hard_gemma4_zoom
tag: visual_search
generation_kwargs:
  max_new_tokens: 24576
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 0.0
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  system_prompt_files: ['prompts/tools/system_gemma_zoom.txt']
