tools:
- class_name: verl.tools.gemma4_zoom_tool.Gemma4ZoomTool
  config:
    type: native
    num_workers: 1
    rate_limit: 50
    timeout: 30
    enable_global_rate_limit: true
    coordinate_system: normalized_1000
    cropped_min_pixels: 518400
    cropped_max_pixels: 1048576
    use_original_resolution_source: true
    original_source_unavailable_policy: fallback
    image_indexing: multi_index
  tool_schema:
    type: function
    function:
      name: image_zoom_in_tool
      description: Zoom in on a region of an available image using a bounding box
        and a short label.
      parameters:
        type: object
        properties:
          bbox_2d:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: '[y1, x1, y2, x2] on a 1000x1000 grid relative to the selected
              image dimensions; y increases downward and x increases rightward.'
          label:
            type: string
            description: A short description of the region.
          img_idx:
            type: integer
            description: Index of the selected image; the original is 0, and crop
              indices are stated in tool responses.
        required:
        - bbox_2d
        - label
        - img_idx
