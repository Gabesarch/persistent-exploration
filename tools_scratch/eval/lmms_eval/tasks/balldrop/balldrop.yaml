dataset_path: loganbolton/sketchvlm-physics-ball-drop
dataset_kwargs:
  cache_dir: /scratch/gpfs/ZHUANGL/hw0171/ball_drop
task: "balldrop"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.balldrop_doc_to_visual
doc_to_text: !function utils.balldrop_doc_to_text
doc_to_target: "final_bucket_gt"

generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

process_results: !function utils.balldrop_process_results
metric_list:
  - metric: balldrop_acc
    aggregation: !function utils.balldrop_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""

metadata:
  version: 0.0
