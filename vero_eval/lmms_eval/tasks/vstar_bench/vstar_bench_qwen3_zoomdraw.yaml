# Qwen3-VL Instruct + the COMBINED zoom+draw toolset on V* (vstar-bench).
# Student counterpart of vstar_bench_gpt55_zoomdraw: same combined toolset
# (image_zoom_in_tool + draw_*; system_base + system_zoom + system_draw), run
# through the lmms_eval async_openai backend with TOOLS=on.
include:
  - vstar_bench.yaml
  - ../_tool_templates/_toolset_zoomdraw_yaml
task: "vstar_bench_qwen3_zoomdraw"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    strip_answer_instruction: true
    post_prompt: ' After inspecting the image with the tools as needed, give your final answer as the correct option letter inside \boxed{}, e.g. \boxed{B}.'
