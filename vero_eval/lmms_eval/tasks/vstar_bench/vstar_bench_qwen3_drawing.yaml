include: _default_template_yaml
task: "vstar_bench_qwen3_drawing"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  do_sample: True
process_results: !function utils.vstar_drawing_process_results
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nUse the available drawing tools to help analyze the image if needed. After your analysis, state your answer as: Final answer: LETTER"
metric_list:
  - metric: vstar_overall_acc
    aggregation: !function utils.vstar_aggregate_results
    higher_is_better: true
