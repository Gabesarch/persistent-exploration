# Training-faithful Vero ZOOM variant of vstar_bench.
#
# Mirrors visual_probe_hard_reasoning_zoom (the confirmed-correct reference): Vero RL
# thinking checkpoint + image_zoom_in_tool, reproducing the RL training INPUT style
# (Layer-A system prompt passed as the system message via _toolset_zoom_vero_yaml, the
# EXACT training tool schema, training sampling, and training_faithful image_indexing).
#
# NOTE: BYTE-FAITHFUL replication only holds for visual_probe (the dataset the checkpoint
# was trained on). For vstar_bench this is a CONSISTENT GENERALIZATION eval — it applies
# the same Vero toolset + sampling + indexing recipe, but it is NOT byte-identical to any
# training input. Dataset wiring (path / process_docs / doc_to_* / scorer / metric_list)
# is kept EXACTLY as vstar_bench_reasoning.yaml; only the Vero zoom toolset, training
# sampling, and image_indexing are layered on top.
#
# Run with MODEL=vero TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "vstar_bench_reasoning_zoom"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 0.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
    strip_answer_instruction: true
metric_list:
  - metric: vstar_overall_acc
    aggregation: !function utils.vstar_aggregate_results
    higher_is_better: true
metadata:
  version: 0.0
  image_indexing: training_faithful
