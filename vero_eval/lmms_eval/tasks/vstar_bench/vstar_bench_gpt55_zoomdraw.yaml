# GPT-5.5 (teacher) + the COMBINED zoom+draw toolset on V* (vstar-bench).
# Distillation-teacher config consumed by vero_eval/distill/collect_traces.py
# (Responses API; see the harness/README for why gpt-5.5 tool-calling can't use
# chat.completions). V* is a visual-search benchmark of small targets in large
# images — exactly where zoom (inspect detail) AND draw (annotate/trace) help, so
# this offers BOTH toolsets at once via _toolset_zoomdraw_yaml (image_zoom_in_tool
# + draw_*; system_base + system_zoom + system_draw concatenated).
#
# The harness reads dataset/prompt from this merged config and the task-specific
# doc_to_text / doc_to_visual / doc_id / score from vstar_bench/distill_adapter.py
# (torch-free), discovered by the default adapter convention.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoomdraw_yaml
task: "vstar_bench_gpt55_zoomdraw"
test_split: test
generation_kwargs:
  max_new_tokens: 16384
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # Strip the dataset's "answer directly" instruction (it discourages tool use);
    # the toolset system prompt drives inspect-then-answer, and we ask for a boxed letter.
    strip_answer_instruction: true
    post_prompt: ' After inspecting the image with the tools as needed, give your final answer as the correct option letter inside \boxed{}, e.g. \boxed{B}.'
metadata:
  distill:
    teacher_model: "gpt-5.5"        # AI Sandbox (Portkey) model id; see /home/lc1556/repo/AI-sandbox
    reasoning_effort: "medium"      # gpt-5* reasoning knob (Responses API)
    reasoning_summary: "auto"       # capture a chain-of-thought summary per turn
    max_output_tokens: 16384        # per Responses API call (caps reasoning+visible)
    max_tool_iterations: 8          # cap multi-turn tool rounds
    max_tool_images: 8              # cap tool-returned images fed back to the model
