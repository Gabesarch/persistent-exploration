# Training-faithful Vero ZOOM variant of countbenchqa.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
# adds the Vero zoom toolset (_toolset_zoom_vero_yaml), training-faithful sampling
# (temperature 0.7, top_p 1.0, top_k -1), and image_indexing: training_faithful.
#
# NOTE: BYTE-FAITHFUL replication of the RL training input is only claimed for the
# visual_probe task. For countbenchqa this is a CONSISTENT GENERALIZATION eval (same
# Vero toolset + sampling style), NOT byte-identical to training.
#
# Dataset wiring (dataset_path / doc_to_* / process_results / metric_list / etc.) is kept
# EXACTLY as countbenchqa_reasoning.yaml. The Vero zoom toolset is layered on via the
# _toolset_zoom_vero_yaml include (Layer-A system prompt + training tool schema +
# image_indexing knob). Run with MODEL=vero TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: vikhyatk/CountBenchQA
task: "countbenchqa_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.countbenchqa_doc_to_visual
doc_to_text: !function utils.countbenchqa_doc_to_text
doc_to_target: "number"
generation_kwargs:
  # Matches the RL training validation sampling (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True

process_results: !function utils.countbenchqa_cot_process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.0
  image_indexing: training_faithful
