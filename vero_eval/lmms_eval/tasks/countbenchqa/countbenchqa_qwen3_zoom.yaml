# Base Qwen3-VL-Instruct multi-turn ZOOM variant of countbenchqa.
#
# Reuses the generic zoom toolset (_toolset_zoom_yaml): allowed_tools=[image_zoom_in_tool]
# + system_base/system_zoom prompts. Instruct (non-think) model, NO forced <think>,
# NO Layer-A. This is the baseline vs the Vero _reasoning_zoom checkpoint.
#
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs:
# keeps the countbenchqa_qwen3_zs dataset wiring (via countbenchqa.yaml) + qwen3
# sampling, layers on the generic zoom toolset, and softens the final-answer
# suppressor so it does not discourage tool use. Run with TOOLS=on.
include:
  - countbenchqa.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "countbenchqa_qwen3_zoom"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: " Your final answer should be a number."
