# Training-faithful Vero ZOOM variant of mmmu_pro (standard 10-options leaf).
#
# Mirrors visual_probe_hard_reasoning_zoom: adds the Vero zoom toolset
# (_toolset_zoom_vero_yaml -> Layer-A system prompt + EXACT training tool schema)
# + training-faithful sampling (temperature 0.7, top_p 1.0, top_k -1) + image_indexing.
#
# BYTE-FAITHFUL only for visual_probe. For this dataset it is a consistent
# GENERALIZATION eval (same Vero tool-use input style), NOT byte-identical to training.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "mmmu_pro_standard_reasoning_zoom"
dataset_path: MMMU/MMMU_Pro
dataset_name: "standard (10 options)"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmmu_pro_doc_to_visual
doc_to_text: !function utils.mmmu_pro_doc_to_text
doc_to_target: "{{answer}}"
generation_kwargs:
  # Matches the RL training validation sampling (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
# The return value of process_results will be used by metrics
process_results: !function utils.mmmu_pro_process_results

metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.mmmu_pro_aggregate_results
    higher_is_better: true

metadata:
  version: 0.0
  image_indexing: training_faithful

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
