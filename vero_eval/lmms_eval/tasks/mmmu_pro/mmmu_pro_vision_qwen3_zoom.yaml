# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mmmu_pro (vision leaf).
#
# Reuses _toolset_zoom_yaml (generic zoom toolset: allowed_tools=[image_zoom_in_tool]
# + system_base/system_zoom prompts). Instruct model, no forced <think>, no Layer-A.
# Baseline vs the Vero mmmu_pro_vision_reasoning_zoom checkpoint eval.
#
# Same dataset wiring + qwen3 sampling as mmmu_pro_vision_qwen3_zs, plus the zoom
# toolset. Run with TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "mmmu_pro_vision_qwen3_zoom"
dataset_path: MMMU/MMMU_Pro
dataset_name: vision
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmmu_pro_doc_to_visual
doc_to_text: "Please answer with the option letter from the given choices."
doc_to_target: "{{answer}}"
# The return value of process_results will be used by metrics
process_results: !function utils.mmmu_pro_process_results

metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.mmmu_pro_aggregate_results
    higher_is_better: true

generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
