# Strict-judge twin of pinpoint_bench_reasoning_zoom.
include:
  - pinpoint_bench.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "pinpoint_bench_reasoning_zoom_strict"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: true
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.pinpoint_bench_aggregate_judge_results_strict
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  image_indexing: training_faithful
