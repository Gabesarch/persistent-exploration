# Qwen3-VL Instruct zero-shot with the generic drawing toolset.
include:
  - pinpoint_bench.yaml
  - ../_tool_templates/_toolset_draw_yaml
task: "pinpoint_bench_qwen3_draw"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "You are given an image. Search the picture to answer the question. Your final answer should be a short, specific phrase. "
    post_prompt: ""
