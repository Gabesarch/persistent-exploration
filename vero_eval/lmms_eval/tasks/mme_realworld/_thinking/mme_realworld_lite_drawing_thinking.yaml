include:
- ../mme_realworld_lite.yaml
- ../../_tool_templates/_thinking/_toolset_draw_thinking_yaml
task: "mme_realworld_lite_drawing_thinking"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nSelect the best answer to the above multiple-choice question based on the image. Put the final option letter in <answer>...</answer> tags."
metadata:
  version: 0.0
  allowed_tools:
  - draw_boxes
  - draw_points
  - draw_lines
  - draw_texts
  - draw_polygons
  system_prompt_files:
  - prompts/tools/system_base_thinking.txt
  - prompts/tools/system_draw.txt
