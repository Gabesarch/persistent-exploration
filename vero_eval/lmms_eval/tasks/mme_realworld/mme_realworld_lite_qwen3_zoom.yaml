# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mme_realworld_lite.
# Reuses the generic _toolset_zoom_yaml (image_zoom_in_tool + system_base/system_zoom
# prompts: instruct multi-turn tool use, NO forced <think>, NO Layer-A). This is the
# instruct (non-think) baseline vs the Vero _reasoning_zoom checkpoint.
#
# IMPORTANT: do NOT `include: mme_realworld_lite.yaml` here. That dataset template
# declares `metadata` as a LIST (`- version: 0.0`); the metadata deep-merge in
# load_yaml_config only merges dict-with-dict, so a list-valued metadata clobbers the
# toolset template's metadata mapping (allowed_tools / system_prompt_files would be
# lost). Instead we inline the dataset wiring verbatim from mme_realworld_lite_qwen3_zs
# (-> mme_realworld_lite.yaml) and include ONLY the zoom toolset template, exactly like
# mme_realworld_lite_reasoning_zoom does for the Vero toolset. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
# --- dataset wiring (verbatim from mme_realworld_lite_qwen3_zs.yaml / mme_realworld_lite.yaml) ---
dataset_path: yifanzhang114/MME-RealWorld-lite-lmms-eval
dataset_kwargs:
  token: True
  # From_YouTube: True
test_split: train
output_type: generate_until
doc_to_visual: !function utils.mme_realworld_doc_to_visual
doc_to_text: !function utils.mme_realworld_doc_to_text
doc_to_target: "answer"
process_results: !function utils.mme_realworld_process_results
metric_list:
  - metric: mme_realworld_score
    aggregation: !function utils.mme_realworld_aggregate_results
    higher_is_better: true
# --- task identity ---
task: "mme_realworld_lite_qwen3_zoom"
# --- qwen3 sampling (verbatim from mme_realworld_lite_qwen3_zs.yaml) ---
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # No "Respond with only ..." — that would hard-suppress multi-turn tool use.
    post_prompt: "\nSelect the best answer to the above multiple-choice question based on the image. Your final answer should be the letter (A, B, C, D, or E) of the correct option."
metadata:
  version: 0.0
