include:
- ../mme_realworld_lite.yaml
- ../../_tool_templates/_instruct/_toolset_zoomdraw_instruct_yaml
task: "mme_realworld_lite_zoomdrawing_instruct"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nSelect the best answer to the above multiple-choice question based on the image. Put the final option letter in <answer>...</answer> tags."
metadata:
  version: 0.0
  allowed_tools:
  - image_zoom_in_tool
  - draw_boxes
  - draw_points
  - draw_lines
  - draw_texts
  - draw_polygons
  system_prompt_files:
  - prompts/tools/system_base_instruct.txt
  - prompts/tools/system_zoom.txt
  - prompts/tools/system_draw.txt
