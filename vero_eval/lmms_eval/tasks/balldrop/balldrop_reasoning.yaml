dataset_path: loganbolton/sketchvlm-physics-ball-drop
dataset_kwargs:
  cache_dir: /scratch/gpfs/ZHUANGL/hw0171/ball_drop
task: "balldrop_reasoning"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.balldrop_doc_to_visual
doc_to_text: !function utils.balldrop_doc_to_text
doc_to_target: "final_bucket_gt"

generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True

process_results: !function utils.balldrop_cot_process_results
metric_list:
  - metric: balldrop_acc
    aggregation: !function utils.balldrop_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: " Put your final answer in <answer></answer> tags."

metadata:
  version: 0.0
