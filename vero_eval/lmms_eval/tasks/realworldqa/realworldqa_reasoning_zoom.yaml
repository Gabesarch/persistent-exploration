# Training-faithful Vero (RL thinking checkpoint) + ZOOM variant of realworldqa.
#
# Mirrors visual_probe_hard_reasoning_zoom (vero toolset via _toolset_zoom_vero_yaml +
# training sampling: temperature 0.7 / top_p 1.0 / top_k -1, max_new_tokens 16384 +
# image_indexing: training_faithful). The zoom tool schema and Layer-A system prompt
# are pinned to the EXACT training values by the included toolset template.
#
# NOTE: BYTE-FAITHFUL replication only holds for visual_probe (the dataset Vero was
# trained on). For realworldqa this is a CONSISTENT GENERALIZATION eval — it applies
# the same tool/sampling/indexing recipe, but is NOT byte-identical to training.
#
# Dataset wiring (dataset_path / doc_to_* / process_results / metric_list) is copied
# verbatim from realworldqa_reasoning.yaml and MUST NOT change.
# Run with MODEL=vero TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: lmms-lab/RealWorldQA
dataset_kwargs:
  token: True
task: "realworldqa_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.realworldqa_doc_to_visual
doc_to_text: !function utils.realworldqa_doc_to_text_removepost
doc_to_target: "answer"
process_results: !function utils.realworldqa_process_results

generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.0
  image_indexing: training_faithful
