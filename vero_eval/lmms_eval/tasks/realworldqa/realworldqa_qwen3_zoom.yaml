# Base Qwen3-VL-Instruct multi-turn ZOOM variant of realworldqa.
#
# Reuses the generic _toolset_zoom_yaml: it contributes metadata.allowed_tools
# (image_zoom_in_tool) and metadata.system_prompt_files (system_base + system_zoom),
# deep-merged with the dataset template's metadata.version. This evaluates the
# INSTRUCT (non-think) base model with multi-turn tool use -- no forced <think>,
# no Layer-A. Baseline counterpart to the Vero realworldqa_reasoning_zoom.
#
# Dataset wiring (dataset_path / dataset_kwargs / doc_to_* / process_results /
# filter_list / metric_list) is copied verbatim from realworldqa_qwen3_zs.yaml and
# MUST NOT change. Qwen3 sampling is the same as the source. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: lmms-lab/RealWorldQA
dataset_kwargs:
  token: True
task: "realworldqa_qwen3_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.realworldqa_doc_to_visual
doc_to_text: !function utils.realworldqa_doc_to_text
doc_to_target: "answer"
process_results: !function utils.realworldqa_process_results

generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True

filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.NumberWordsToDigitsFilter
      - function: !function utils.MultiChoiceRegexFilter
        group_select: 0
        ignore_case: true
        ignore_punctuation: true
        regex_pattern: "(\\([A-Z]\\))"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Please answer with the option letter from the options above."
  gpt4v:
    pre_prompt: ""
    post_prompt: ""
  xcomposer2_4khd:
    pre_prompt: "[UNUSED_TOKEN_146]user\nQuestion: "
    post_prompt: "[UNUSED_TOKEN_145]\n[UNUSED_TOKEN_146]assistant\nThe answer is"
metadata:
  version: 0.0
