# Base Qwen3-VL-Instruct multi-turn ZOOM variant of infovqa_val.
#
# Reuses the generic zoom toolset (_toolset_zoom_yaml -> allowed_tools=[image_zoom_in_tool]
# + system_base/system_zoom prompts for instruct multi-turn tool use). This evaluates the
# INSTRUCT (non-think) base model: NO forced <think>, NO Layer-A. It is the baseline vs the
# Vero RL checkpoint variant infovqa_val_reasoning_zoom.
#
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs: same
# dataset wiring + qwen3 sampling as the zero-shot baseline (infovqa_val_qwen3_zs), plus the
# generic zoom toolset. DATASET WIRING (dataset_path / dataset_name / dataset_kwargs /
# doc_to_* / process_results / metric_list / test_split / output_type) is inherited UNCHANGED
# from _default_template_infovqa_yaml, exactly as the source infovqa_val_qwen3_zs.
#
# The post_prompt is softened from the source's suppressor ("Answer the question using a
# single word or phrase.") to a non-suppressing form so it does not discourage tool use,
# mirroring how visual_probe_hard_qwen3_zoom softened "Respond with ... only".
#
# Run with TOOLS=on.
include:
  - _default_template_infovqa_yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "infovqa_val_qwen3_zoom"
test_split: validation
output_type: generate_until
metric_list:
  - metric: anls
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nYour final answer should be a single word or phrase."
metadata:
  version: 0.0
