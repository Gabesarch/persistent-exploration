task: "infovqa_val_zoomdrawing_vero"
test_split: validation
output_type: generate_until
metric_list:
- metric: anls
  aggregation: mean
  higher_is_better: true
metadata:
  image_indexing: training_faithful
include:
- ../_default_template_infovqa_yaml
- ../../_tool_templates/_vero/_toolset_zoomdraw_vero_yaml
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
