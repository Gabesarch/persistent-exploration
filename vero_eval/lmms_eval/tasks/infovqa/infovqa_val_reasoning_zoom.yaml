# Training-faithful Vero ZOOM variant of infovqa_val.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
# same Vero zoom toolset (_toolset_zoom_vero_yaml -> training Layer-A system prompt +
# served chat_template "# Tools" block + EXACT training tool schema), same
# training-faithful sampling (temperature 0.7, top_p 1.0, top_k -1, max_new_tokens 16384),
# and image_indexing: training_faithful.
#
# IMPORTANT: this is BYTE-FAITHFUL only for visual_probe (the dataset the checkpoint was
# trained on). For infovqa this is a CONSISTENT GENERALIZATION eval — it applies the same
# Vero input style + toolset + sampling, but is NOT byte-identical to any training input.
#
# DATASET WIRING (dataset_path / dataset_name / dataset_kwargs / doc_to_* / process_results /
# metric_list / test_split / output_type) is inherited UNCHANGED from
# _default_template_infovqa_yaml, exactly as the source infovqa_val_reasoning.yaml.
#
# The default template's post_prompt ("\nAnswer the question using a single word or phrase.")
# is neutralized (pre/post overridden below): it would fight Layer-A, which requires the
# model to answer inside <answer> ... </answer> with a \boxed{} concise result. pre_prompt
# "\n" reproduces training's "<image>\n{question}" user-turn separator (the served chat
# template emits no newline after the image), mirroring the reference.
#
# Run with MODEL=vero TOOLS=on.
include:
  - _default_template_infovqa_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "infovqa_val_reasoning_zoom"
test_split: validation
output_type: generate_until
metric_list:
  - metric: anls
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    # pre_prompt "\n" reproduces training's "<image>\n{question}" user-turn separator.
    # post_prompt empty: neutralizes the default template's "single word or phrase"
    # instruction, which would conflict with Layer-A's <answer>/\boxed{} answer protocol.
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  image_indexing: training_faithful
