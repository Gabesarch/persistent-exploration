dataset_path: AI4Math/MathVista
dataset_kwargs:
  token: true
task: "mathvista_testmini_drawing_thinking"
test_split: testmini
output_type: generate_until
doc_to_visual: !function ../utils.mathvista_doc_to_visual
doc_to_text: !function ../utils.mathvista_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  do_sample: true
process_results: !function ../utils.mathvista_process_results
metric_list:
- metric: submission
  aggregation: !function ../utils.mathvista_aggregate_results
  higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    shot_type: "direct" # can be "reason-first", "solution", "step-by-step"
    shot: 0
    use_caption: false
    use_ocr: false
  phi3v:
    shot_type: "solution"
include:
- ../../_tool_templates/_thinking/_toolset_draw_thinking_yaml
