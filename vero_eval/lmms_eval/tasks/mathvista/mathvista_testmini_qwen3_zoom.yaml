# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mathvista_testmini.
#
# Reuses the generic zoom toolset (../_tool_templates/_toolset_zoom_yaml): it
# contributes metadata.allowed_tools (image_zoom_in_tool) + metadata.system_prompt_files
# (system_base + system_zoom) for instruct multi-turn tool use. This is the INSTRUCT
# (non-think) base model: NO forced <think>, NO Layer-A. Baseline vs the Vero
# mathvista_testmini_reasoning_zoom checkpoint.
#
# DATASET WIRING (dataset_path / dataset_kwargs / doc_to_* / process_results /
# metric_list / shot_type) is IDENTICAL to mathvista_testmini_qwen3_zs.yaml, and the
# qwen3 sampling is reused verbatim. This mirrors how visual_probe_hard_qwen3_zoom
# relates to visual_probe_hard_qwen3_zs. shot_type "direct" produces an EMPTY hint, so
# there is no final-answer suppressor that would discourage tool use. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: AI4Math/MathVista
dataset_kwargs:
  token: True
task: "mathvista_testmini_qwen3_zoom"
test_split: testmini
output_type: generate_until
doc_to_visual: !function utils.mathvista_doc_to_visual
doc_to_text: !function utils.mathvista_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.mathvista_process_results
metric_list:
  - metric: submission
    aggregation: !function utils.mathvista_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    shot_type: "direct" # can be "reason-first", "solution", "step-by-step"
    shot: 0
    use_caption: False
    use_ocr: False
  phi3v:
    shot_type: "solution"
metadata:
  version: 0.0
