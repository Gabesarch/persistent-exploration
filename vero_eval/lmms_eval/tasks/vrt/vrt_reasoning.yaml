dataset_path: /scratch/gpfs/ZHUANGL/hw0171/VRT-Eval/vrt_eval_hf
task: "vrt_reasoning"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.vrt_doc_to_visual
doc_to_text: !function utils.vrt_doc_to_text
doc_to_target: "human_answer_caption"

generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: true

process_results: !function utils.vrt_cot_process_results
metric_list:
  - metric: vrt_acc
    aggregation: !function utils.vrt_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: " Put your final answer in <answer></answer> tags."

metadata:
  version: 0.0
