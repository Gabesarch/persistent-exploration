dataset_path: /scratch/gpfs/ZHUANGL/hw0171/VRT-Eval/vrt_eval_hf
task: "vrt"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.vrt_doc_to_visual
doc_to_text: !function utils.vrt_doc_to_text
doc_to_target: "human_answer_caption"

generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
