# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mia_bench.
# Reuses ../_tool_templates/_toolset_zoom_yaml (generic zoom toolset): instruct
# model with multi-turn tool use, NO forced <think>, NO Layer-A. Serves as the
# instruct (non-think) baseline vs the Vero _reasoning_zoom checkpoint.
#
# Modular composition: dataset template (mia_bench.yaml) + reusable zoom toolset
# template. The toolset template contributes metadata.allowed_tools
# (image_zoom_in_tool) and metadata.system_prompt_files (system_base +
# system_zoom), deep-merged with the dataset template's metadata. Run with
# TOOLS=on.
include:
  - mia_bench.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "mia_bench_qwen3_zoom"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
