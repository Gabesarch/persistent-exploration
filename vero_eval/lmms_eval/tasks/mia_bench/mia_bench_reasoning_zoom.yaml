# Vero (RL thinking checkpoint) + ZOOM on MIA-Bench — TRAINING-FAITHFUL variant.
#
# Mirrors visual_probe_hard_reasoning_zoom (vero toolset + training sampling +
# image_indexing: training_faithful), but applied to the MIA-Bench dataset wiring.
# This is a consistent GENERALIZATION eval, NOT byte-identical to RL training:
# only visual_probe is byte-faithful to the checkpoint's training input. Here we
# reuse the exact Vero zoom toolset / sampling / Layer-A protocol for an
# apples-to-apples comparison on a different benchmark.
#
# Dataset wiring (dataset_path/process_results/scorer/metric/test_split/etc.) is
# inherited UNCHANGED from mia_bench.yaml; we only add the zoom toolset, the
# training-faithful sampling, and image_indexing. Run with MODEL=vero TOOLS=on.
include:
  - mia_bench.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "mia_bench_reasoning_zoom"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
metadata:
  image_indexing: training_faithful
