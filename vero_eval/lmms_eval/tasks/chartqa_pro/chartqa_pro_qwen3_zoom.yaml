# Base Qwen3-VL-Instruct multi-turn ZOOM variant of chartqa_pro.
#
# Evaluates the INSTRUCT (non-think) base model with multi-turn tool use, as a
# baseline vs the Vero checkpoint (chartqa_pro_reasoning_zoom). It reuses the
# generic zoom toolset (_toolset_zoom_yaml): NO forced <think>, NO Layer-A.
#
# Modular composition: the chartqa_pro_qwen3_zs dataset wiring (dataset_path,
# doc_to_*, scorer, metric_list, qwen3 sampling) + the reusable zoom toolset
# template. The toolset template contributes metadata.allowed_tools
# (image_zoom_in_tool) and metadata.system_prompt_files (system_base +
# system_zoom), deep-merged with this task's metadata.version. metadata MUST be a
# dict so its keys merge with the toolset's metadata; a list would silently drop
# allowed_tools. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: ahmed-masry/ChartQAPro
dataset_kwargs:
  token: True
task: "chartqa_pro_qwen3_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.chartqa_pro_doc_to_visual
doc_to_text: !function utils.chartqa_pro_doc_to_text
doc_to_target: "Answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.chartqa_pro_process_results
metric_list:
  - metric: relaxed_overall
    aggregation: mean
    higher_is_better: true
  - metric: relaxed_human_split
    aggregation: mean
    higher_is_better: true
  - metric: relaxed_augmented_split
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nYour final answer should be a single word or phrase."
