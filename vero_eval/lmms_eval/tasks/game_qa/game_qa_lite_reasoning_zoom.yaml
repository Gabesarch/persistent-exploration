# Training-faithful Vero ZOOM variant of game_qa_lite.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
#   - vero zoom toolset (Layer-A system prompt + EXACT training tool schema) via
#     _toolset_zoom_vero_yaml.
#   - training-faithful sampling (temperature 0.7, top_p 1.0, top_k -1).
#   - image_indexing: training_faithful (tool_response announces only the zoomed region;
#     training used img_idx 0 in all calls).
#
# NOTE: BYTE-FAITHFUL replication only holds for visual_probe (the dataset the checkpoint
# was trained on). For game_qa_lite this is a CONSISTENT GENERALIZATION eval — it reuses the
# same toolset + sampling + indexing as training, but is NOT byte-identical to any training
# input. Dataset wiring (dataset_path / process_results / scorer) is kept identical to
# game_qa_lite_reasoning. Run with MODEL=vero TOOLS=on.
dataset_path: gsarch/Game-QA-Lite
dataset_name: "default"
task: "game_qa_lite_reasoning_zoom"
test_split: train
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  image_indexing: training_faithful
