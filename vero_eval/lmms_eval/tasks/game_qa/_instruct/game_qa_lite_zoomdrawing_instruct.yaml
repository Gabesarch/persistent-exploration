dataset_path: gsarch/Game-QA-Lite
dataset_name: "default"
task: "game_qa_lite_zoomdrawing_instruct"
test_split: train
include:
- ../_default_template_yaml
- ../../_tool_templates/_instruct/_toolset_zoomdraw_instruct_yaml
process_results: !function ../utils.game_qa_process_results
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Put the final number or option letter in <answer>...</answer> tags."
