# Training-faithful Vero ZOOM variant of charxiv (leaf: charxiv_val_reasoning_reasoning).
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
# adds the Vero zoom toolset (system Layer-A prompt + exact training tool schema via
# _toolset_zoom_vero_yaml), training-faithful sampling (temperature 0.7, top_p 1.0,
# top_k -1), and image_indexing: training_faithful.
#
# NOTE: BYTE-FAITHFUL replication of the RL training input is guaranteed ONLY for the
# visual_probe dataset (the actual training distribution). For charxiv this is a
# CONSISTENT GENERALIZATION eval — same tool/prompt/sampling style as training, but NOT
# byte-identical to any training sample. Dataset wiring (paths/scorer/question format) is
# kept EXACTLY as the source charxiv_val_reasoning_reasoning.yaml.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
test_split: validation
doc_to_messages: !function utils.charxiv_reasoning_doc_to_messages_cot
doc_to_text: !function utils.charxiv_reasoning_doc_to_text_cot
doc_to_target: "reasoning_a"
task: charxiv_val_reasoning_reasoning_zoom
process_results: !function utils.charxiv_reasoning_process_results
metric_list:
  - metric: reasoning_acc
    aggregation: !function utils.charxiv_reasoning_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
metadata:
  image_indexing: training_faithful
