test_split: validation
doc_to_messages: !function ../utils.charxiv_reasoning_doc_to_messages_cot
doc_to_text: !function ../utils.charxiv_reasoning_doc_to_text_cot
doc_to_target: "reasoning_a"
metadata:
  image_indexing: training_faithful
include:
- ../_default_template_yaml
- ../../_tool_templates/_vero/_toolset_zoomdraw_vero_yaml
task: charxiv_zoomdrawing_vero
process_results: !function ../utils.charxiv_reasoning_process_results
metric_list:
- metric: reasoning_acc
  aggregation: !function ../utils.charxiv_reasoning_aggregate_results
  higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
generation_kwargs:
  max_new_tokens: 16384

  temperature: 0.7
  top_p: 1.0
  top_k: -1
