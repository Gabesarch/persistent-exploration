# Base Qwen3-VL-Instruct multi-turn ZOOM variant of charxiv (leaf: charxiv_val_reasoning_reasoning).
#
# Evaluates the INSTRUCT (non-think) base model with multi-turn tool use, as a
# baseline vs the Vero checkpoint (charxiv_val_reasoning_reasoning_zoom). It reuses
# the generic zoom toolset (_toolset_zoom_yaml): NO forced <think>, NO Layer-A.
#
# Modular composition: the source charxiv qwen3 baseline dataset wiring
# (_default_template_yaml + doc_to_*, scorer, metric_list) + qwen3 sampling, plus
# the reusable zoom toolset template. The toolset template contributes
# metadata.allowed_tools (image_zoom_in_tool) and metadata.system_prompt_files
# (system_base + system_zoom), deep-merged with this task's metadata. metadata MUST
# be a dict so its keys merge with the toolset's metadata; a list would silently
# drop allowed_tools. Run with TOOLS=on.
#
# Dataset wiring (paths/scorer/question format) is kept EXACTLY as the source
# charxiv_val_reasoning_reasoning_samplingq3.yaml (closest qwen3 baseline leaf).
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
test_split: validation
doc_to_messages: !function utils.charxiv_reasoning_doc_to_messages_cot
doc_to_text: !function utils.charxiv_reasoning_doc_to_text_cot
doc_to_target: "reasoning_a"
task: charxiv_val_reasoning_reasoning_qwen3_zoom
process_results: !function utils.charxiv_reasoning_process_results
metric_list:
  - metric: reasoning_acc
    aggregation: !function utils.charxiv_reasoning_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
