# Base Qwen3-VL-Instruct multi-turn ZOOM variant of chartmuseum.
#
# Reuses the generic _toolset_zoom_yaml (instruct model, multi-turn tool use, NO
# forced <think>, NO Layer-A) and keeps chartmuseum's dataset wiring / judge scorer
# / question format EXACTLY as chartmuseum_qwen3_zs.yaml, plus the same qwen3
# sampling. This is the INSTRUCT baseline vs the Vero chartmuseum_reasoning_zoom.
#
# The toolset template contributes metadata.allowed_tools (image_zoom_in_tool) and
# metadata.system_prompt_files (system_base + system_zoom), deep-merged with this
# task's metadata.version, so metadata MUST stay a dict. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: gsarch/ChartMuseum
task: chartmuseum_qwen3_zoom
test_split: test
output_type: generate_until
doc_to_visual: !function utils.chartmuseum_doc_to_visual
doc_to_text: !function utils.chartmuseum_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.chartmuseum_process_results
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.chartmuseum_aggregate_judge_results
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nYour final answer should be a single word or phrase."
