# Training-faithful Vero (RL thinking checkpoint) + ZOOM variant of chartmuseum.
#
# Mirrors visual_probe_hard_reasoning_zoom: it adds the Vero image_zoom_in_tool toolset
# (via _toolset_zoom_vero_yaml) + the training-faithful sampling (temperature 0.7,
# top_p 1.0, top_k -1, max_new_tokens 16384) + image_indexing: training_faithful, while
# keeping chartmuseum's dataset wiring / judge scorer / question format EXACTLY as
# chartmuseum_reasoning.yaml.
#
# BYTE-FAITHFUL replication of the RL training input is only claimed for visual_probe
# (the dataset the checkpoint was trained on). For chartmuseum this is a CONSISTENT
# GENERALIZATION eval that reuses the same Vero toolset + sampling conventions; it is
# NOT byte-identical to any training sample.
#
# Run with MODEL=vero TOOLS=on. The _toolset_zoom_vero_yaml supplies the EXACT training
# Layer-A system prompt + tool schema; the metadata MUST stay a dict so that toolset's
# allowed_tools / system_prompt_files deep-merge through.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: gsarch/ChartMuseum
task: chartmuseum_reasoning_zoom
test_split: test
output_type: generate_until
doc_to_visual: !function utils.chartmuseum_doc_to_visual
doc_to_text: !function utils.chartmuseum_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0,
  # top_k -1). top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the
  # checkpoint's generation_config defaults (top_k=20, top_p=0.8), which diverges from
  # training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
process_results: !function utils.chartmuseum_process_results
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.chartmuseum_aggregate_judge_results
    higher_is_better: true
metadata:
  version: 0.0
  image_indexing: training_faithful
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
