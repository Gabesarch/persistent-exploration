# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mmifeval (reuses the generic
# _toolset_zoom_yaml). Instruct (non-think) base model with multi-turn tool use; NO
# forced <think>, NO Layer-A. Serves as the base-model baseline vs the Vero
# mmifeval_reasoning_zoom checkpoint.
#
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs:
# the DATASET WIRING + qwen3 sampling are reused from mmifeval_qwen3_zs.yaml, and the
# generic zoom toolset is layered on top via the include below.
#
# The zoom toolset (../_tool_templates/_toolset_zoom_yaml) contributes:
#   - metadata.allowed_tools = [image_zoom_in_tool]
#   - metadata.system_prompt_files = [system_base, system_zoom] (instruct multi-turn
#     tool-use prompts, no <think>)
# deep-merged with this task's metadata.version. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: lscpku/MMIFEval
dataset_kwargs:
  token: true
task: "mmifeval_qwen3_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmifeval_doc_to_visual
doc_to_text: !function utils.mmifeval_doc_to_text
doc_to_target: ""
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.mmifeval_process_results
metric_list:
  - metric: mmifeval_overall_accuracy
    aggregation: !function utils.mmifeval_aggregate_overall
    higher_is_better: true
  - metric: mmifeval_p_level_accuracy
    aggregation: !function utils.mmifeval_aggregate_p_level
    higher_is_better: true
  - metric: mmifeval_c_level_accuracy
    aggregation: !function utils.mmifeval_aggregate_c_level
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.0
