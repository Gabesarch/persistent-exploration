include:
- ../countqa.yaml
- ../../_tool_templates/_thinking/_toolset_draw_thinking_yaml
task: "countqa_drawing_thinking"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  do_sample: true
process_results: !function ../utils.countqa_cot_process_results
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: " Put the final count in <answer>...</answer> tags."
