# Training-faithful Vero ZOOM variant of countqa.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
# adds the Vero zoom toolset (system Layer-A + exact training tool schema), training-faithful
# sampling (temperature 0.7, top_p 1.0, top_k -1), and image_indexing: training_faithful.
#
# NOTE: BYTE-FAITHFUL replication only holds for visual_probe (the dataset Vero was trained on).
# For countqa this is a CONSISTENT GENERALIZATION eval — same toolset/sampling/input style as
# training, but NOT byte-identical to the training data.
#
# Dataset wiring (dataset_path / process_docs / doc_to_* / process_results / metric_list /
# test_split / output_type) is kept EXACTLY as countqa_reasoning.yaml. Run with MODEL=vero
# TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: /scratch/gpfs/ZHUANGL/lc1556/hf_cache/hub/datasets--Jayant-Sravan--CountQA/snapshots/f92cc6fe46542c61e2916e3d2ae9a911e2216b1a
process_docs: !function utils.countqa_process_docs
task: "countqa_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.countqa_doc_to_visual
doc_to_text: !function utils.countqa_doc_to_text
doc_to_target: !function utils.countqa_doc_to_target

generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True

process_results: !function utils.countqa_cot_process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    # Training's user turn is "<image>\n{question}", which decodes to "user\n\n{question}".
    # The served chat template emits no newline after the image, so that separator newline
    # must live in the text. pre_prompt "\n" reproduces training's user turn. It does NOT
    # add a final-answer instruction (Layer-A already governs the <answer> format).
    pre_prompt: "\n"
    post_prompt: ""

metadata:
  version: 0.0
  image_indexing: training_faithful
