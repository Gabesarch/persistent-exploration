# Base-model baseline: same generation and tool metadata as the saved VisualProbe base evaluation.
# Fixed 500-example public Challenge-Lite subset of HStarBench Mixed.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: gsarch/HStarBench-Lite
task: "hstarbench_mixed_lite_base_visualprobe_setup"
test_split: test
tag:
  - hstarbench_lite
  - humanoid_visual_search
  - visual_search
output_type: generate_until
doc_to_visual: !function utils.hstarbench_bbox_zoom_doc_to_visual
doc_to_text: !function utils.hstarbench_point_zoom_doc_to_text
doc_to_messages: !function utils.hstarbench_point_zoom_doc_to_messages_vero
doc_to_target: !function utils.hstarbench_doc_to_target
process_results: !function utils.hstarbench_point_zoom_process_results
generation_kwargs:
  max_new_tokens: 24576
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 0.0
  do_sample: true
  until:
  - '


    '
lmms_eval_specific_kwargs:
  default:
    use_panorama_strip: true
    pre_prompt: "\n"
    post_prompt: "Use coordinates relative to the original full image: x and y must each be normalized to the 0-1000 range. In the <answer> block, output only this JSON array: [{\"point_2d\": [x, y]}].\n\n\n\n"
metric_list:
  - metric: hstarbench_point_in_box_acc
    aggregation: !function utils.hstarbench_aggregate_success
    higher_is_better: true
metadata:
  allowed_tools:
  - image_zoom_in_tool
  show_initial_image_index_hint: false
  restore_assistant_forced_prefill: true
  system_prompt_files:
  - prompts/tools/system_vero_reasoning.txt
  system_prompt_preserve_trailing_newline: true
  tool_schema_overrides:
    image_zoom_in_tool:
      description: Zoom in on a specific region of an image by cropping it based on
        a bounding box (bbox) and an optional object label
      parameters:
        type: object
        properties:
          bbox_2d:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: The bounding box of the region to zoom in, as [x1, y1, x2,
              y2], where (x1, y1) is the top-left corner and (x2, y2) is the bottom-right
              corner
          label:
            type: string
            description: The name or label of the object in the specified bounding
              box
          img_idx:
            type: number
            description: The index of the zoomed-in image (starting from 0)
        required:
        - bbox_2d
        - label
        - img_idx
  version: 0.0
  image_indexing: training_faithful
