include: hstarbench_hos.yaml
task: "hstarbench_hos_reasoning"
tag:
  - hstarbench
  - humanoid_visual_search
  - visual_search
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.6
  do_sample: true
  max_agentic_steps: 10
lmms_eval_specific_kwargs:
  default:
    include_erp_for_mcp: true
    use_panorama_strip: true
    score_mode: zoom_align
metric_list:
  - metric: hstarbench_success
    aggregation: !function utils.hstarbench_aggregate_success
    higher_is_better: true
  - metric: hstarbench_zoom_align_success
    aggregation: !function utils.hstarbench_aggregate_zoom_align_success
    higher_is_better: true
metadata:
  version: 0.2
  description: "HOS strip+zoom agentic; success = bbox center in target cone"
