# Base Qwen3-VL-Instruct multi-turn ZOOM variant of evochart.
#
# Evaluates the INSTRUCT (non-think) base model with multi-turn tool use as a
# baseline vs the Vero checkpoint. Reuses the generic _toolset_zoom_yaml (NO
# forced <think>, NO Layer-A): the toolset template contributes
# metadata.allowed_tools (image_zoom_in_tool) + metadata.system_prompt_files
# (system_base + system_zoom) for instruct-style multi-turn tool calling.
#
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs:
# dataset wiring + qwen3 sampling are taken verbatim from evochart_qwen3_zs.yaml;
# only the generic zoom toolset is layered on top and the final-answer suppressor
# is softened so it does not discourage tool use. Baseline counterpart to the
# Vero evochart_reasoning_zoom. Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: gsarch/EvoChart-QA
task: "evochart_qwen3_zoom"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.evochart_doc_to_visual
doc_to_text: !function utils.evochart_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.evochart_process_results
metric_list:
  - metric: accuracy
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nYour final answer should be a single word or phrase."
