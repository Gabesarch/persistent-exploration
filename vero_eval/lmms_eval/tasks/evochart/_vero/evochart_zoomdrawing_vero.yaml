dataset_path: gsarch/EvoChart-QA
task: evochart_zoomdrawing_vero
test_split: train
output_type: generate_until
doc_to_visual: !function ../utils.evochart_doc_to_visual
doc_to_text: !function ../utils.evochart_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: true
process_results: !function ../utils.evochart_process_results
metric_list:
- metric: accuracy
  aggregation: mean
  higher_is_better: true
metadata:
  version: 0.0
  image_indexing: training_faithful
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
include:
- ../../_tool_templates/_vero/_toolset_zoomdraw_vero_yaml
