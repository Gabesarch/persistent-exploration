# Training-faithful Vero (RL thinking checkpoint) + ZOOM variant of evochart.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero zoom toolset + training-faithful
# sampling + image_indexing) so this checkpoint is evaluated in the same RL-training
# INPUT style: Layer-A system prompt (system_vero_reasoning.txt) passed as the system
# message, the served chat_template's appended "# Tools" block + the EXACT training tool
# schema, a bare question, and forced-<think> generation.
#
# NOTE: BYTE-FAITHFUL replication is only claimed for visual_probe (whose 403.jsonl the
# toolset was verified against). For evochart this is a CONSISTENT GENERALIZATION eval —
# same toolset/sampling/indexing knobs, but NOT byte-identical to training data.
#
# Dataset wiring (dataset_path / doc_to_visual / doc_to_text / doc_to_target /
# process_results / metric_list / test_split / output_type) is copied verbatim from
# evochart_reasoning.yaml; only the Vero toolset, sampling, and image_indexing are added.
# Run with MODEL=vero TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: gsarch/EvoChart-QA
task: "evochart_reasoning_zoom"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.evochart_doc_to_visual
doc_to_text: !function utils.evochart_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
process_results: !function utils.evochart_process_results
metric_list:
  - metric: accuracy
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0
  image_indexing: training_faithful
lmms_eval_specific_kwargs:
  default:
    # pre_prompt "\n" reproduces training's user turn separator ("<image>\n{question}");
    # the served chat template emits no newline after the image, so that separator must
    # live in the text. It does NOT add a final-answer instruction (Layer A handles that).
    pre_prompt: "\n"
    post_prompt: ""
