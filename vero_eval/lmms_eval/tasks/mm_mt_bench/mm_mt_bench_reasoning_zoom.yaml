# Training-faithful Vero (RL thinking checkpoint) + ZOOM variant of mm_mt_bench.
#
# Mirrors visual_probe_hard_reasoning_zoom: it layers the Vero zoom toolset
# (_toolset_zoom_vero_yaml -> training Layer-A system prompt + EXACT training tool
# schema) plus the training-faithful sampling (temperature 0.7, top_p 1.0, top_k -1)
# and image_indexing: training_faithful onto the existing mm_mt_bench dataset wiring.
#
# NOTE: this is BYTE-FAITHFUL to RL training ONLY for the visual_probe task. For
# mm_mt_bench this is a CONSISTENT GENERALIZATION eval (same Vero tool-use input
# style + sampling), NOT a byte-identical replay of any training input.
#
# Dataset wiring (dataset_path / kwargs / process_docs / doc_to_* / process_results /
# metric_list / scorer) is inherited UNCHANGED from mm_mt_bench.yaml. Run with
# MODEL=vero TOOLS=on.
include:
  - mm_mt_bench.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "mm_mt_bench_reasoning_zoom"
generation_kwargs:
  # Matches the RL training validation sampling (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
metadata:
  image_indexing: training_faithful
