# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mm_mt_bench.
#
# Evaluates the INSTRUCT (non-think) base model with multi-turn tool use, as a
# baseline vs the Vero _reasoning_zoom checkpoint. Reuses the GENERIC zoom toolset
# (_toolset_zoom_yaml -> allowed_tools=[image_zoom_in_tool] + system_base/system_zoom
# prompts): instruct-style multi-turn tool calling with NO forced <think> and NO
# training Layer-A. Mirrors how visual_probe_hard_qwen3_zoom relates to
# visual_probe_hard_qwen3_zs.
#
# Dataset wiring (dataset_path / kwargs / process_docs / doc_to_* / process_results /
# metric_list / scorer) is inherited UNCHANGED from mm_mt_bench.yaml; the qwen3
# sampling is kept verbatim from mm_mt_bench_qwen3_zs.yaml. Run with TOOLS=on.
include:
  - mm_mt_bench.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "mm_mt_bench_qwen3_zoom"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
