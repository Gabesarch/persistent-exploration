# Training-faithful Vero ZOOM variant of mmvetv2_group_img.
#
# Mirrors visual_probe_hard_reasoning_zoom (vero toolset + training sampling):
#   - system prompt = training Layer A (system_vero_reasoning.txt, passed as the system
#     message) + the served chat_template's appended "# Tools" block + tool schema.
#   - tool schema = the EXACT training schema (via _toolset_zoom_vero_yaml's
#     tool_schema_overrides).
#   - image_indexing: training_faithful (crop registered internally, NOT announced).
#   - training sampling: temperature 0.7, top_p 1.0, top_k -1.
#
# BYTE-FAITHFUL only for visual_probe. For this dataset this is a CONSISTENT
# GENERALIZATION eval, NOT byte-identical to training. The dataset wiring
# (dataset_path / doc_to_visual / doc_to_text / scorer) is kept identical to
# mmvetv2_group_img_reasoning.yaml; only the Vero zoom toolset + training-faithful
# sampling + image_indexing are added.
#
# Run with MODEL=vero TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: whyu/mm-vet-v2
dataset_kwargs:
  token: true
task: "mmvetv2_group_img_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmvet_group_img_doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{answer}}"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
process_results: !function utils.mmvet_process_results
metric_list:
  - metric: gpt_eval_score
    aggregation: !function utils.mmvet_aggregate_results
    higher_is_better: true
metadata:
  version: 0.0
  interleaved_format: false
  image_indexing: training_faithful
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
