# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mmvetv2_group_img.
#
# Reuses the generic zoom toolset (_toolset_zoom_yaml): instruct (non-think)
# model, NO forced <think>, NO Layer-A. The toolset template contributes
# metadata.allowed_tools (image_zoom_in_tool) + metadata.system_prompt_files
# (system_base + system_zoom) for multi-turn tool calling, deep-merged with this
# task's metadata.
#
# This is the INSTRUCT baseline vs the Vero mmvetv2_group_img_reasoning_zoom.
# Dataset wiring (dataset_path / doc_to_visual / doc_to_text / scorer) and qwen3
# sampling are kept identical to mmvetv2_group_img_qwen3_zs.yaml; only the generic
# zoom toolset is added (mirroring how visual_probe_hard_qwen3_zoom relates to
# visual_probe_hard_qwen3_zs). Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: whyu/mm-vet-v2
dataset_kwargs:
  token: true
task: "mmvetv2_group_img_qwen3_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmvet_group_img_doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{answer}}"
generation_kwargs:
  # Qwen3-VL sampling from mmvetv2_group_img_qwen3_zs (temperature 1.0, top_p 1.0,
  # top_k 40, presence_penalty 2.0). max_new_tokens raised to 16384 (the qwen3 zoom
  # standard, matching visual_probe_hard_qwen3_zoom + mmvetv2 _reasoning_zoom): the
  # 1024 zero-shot budget is too small for multi-turn tool use.
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: true
process_results: !function utils.mmvet_process_results
metric_list:
  - metric: gpt_eval_score
    aggregation: !function utils.mmvet_aggregate_results
    higher_is_better: true
metadata:
  version: 0.0
  interleaved_format: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
