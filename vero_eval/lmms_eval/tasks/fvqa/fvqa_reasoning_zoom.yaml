# Training-faithful Vero ZOOM variant of fvqa.
#
# Mirrors visual_probe_hard_reasoning_zoom (vero toolset + training sampling +
# image_indexing: training_faithful). The dataset wiring (dataset_path, doc_to_*,
# process_results, scorer/metric) is kept EXACTLY as fvqa_reasoning.yaml.
#
# NOTE: this is BYTE-FAITHFUL only for visual_probe. For this dataset it is a
# consistent GENERALIZATION eval (same Vero toolset + training-style sampling),
# NOT byte-identical to the RL training input.
#
# The source defines its dataset inline (no dataset template), so those fields are
# copied here verbatim; only the Vero zoom toolset template is added via include:.
# Run with MODEL=vero TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: lmms-lab/FVQA
task: "fvqa_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.fvqa_doc_to_visual
doc_to_text: !function utils.fvqa_doc_to_text
doc_to_target: !function utils.fvqa_doc_to_target
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
process_results: !function utils.fvqa_process_results
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.fvqa_aggregate_judge_results
    higher_is_better: true
metadata:
  version: 0.0
  image_indexing: training_faithful
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
