# Base Qwen3-VL-Instruct multi-turn ZOOM variant of fvqa.
#
# Reuses the generic _toolset_zoom_yaml (image_zoom_in_tool + system_base/system_zoom
# prompts) for instruct-model multi-turn tool calling. No forced <think>, no Layer-A.
# This is the INSTRUCT (non-think) base-model baseline vs the Vero fvqa_reasoning_zoom.
#
# The source (fvqa_qwen3_zs.yaml) defines its dataset wiring inline (no dataset
# template), so those fields are copied here verbatim; only the generic zoom toolset
# template is added via include:. Qwen3 sampling knobs are kept as in the source; the
# token budget is raised to 16384 for multi-turn tool use (mirrors the REFERENCE
# visual_probe_hard_qwen3_zoom). Run with TOOLS=on.
include:
  - ../_tool_templates/_toolset_zoom_yaml
dataset_path: lmms-lab/FVQA
task: "fvqa_qwen3_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.fvqa_doc_to_visual
doc_to_text: !function utils.fvqa_doc_to_text
doc_to_target: !function utils.fvqa_doc_to_target
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.fvqa_process_results
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.fvqa_aggregate_judge_results
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
