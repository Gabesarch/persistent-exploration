# Vero (RL thinking checkpoint) + ZOOM toolset on ScreenSpot-Pro.
# Mirrors screenspotpro_point_in_box_reasoning: the point_2d answer format (NOT
# computer_use - Vero was not trained on the computer_use protocol), abs-pixel
# scoring. Vero's baked template handles think/boxed + tool instructions, so we
# offer the zoom tool (allowed_tools) but pass no system fragments. Run with
# MODEL=vero TOOLS=on.
include:
  - _default_template_point_yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "screenspotpro_point_in_box_reasoning_zoom"
test_split: train
process_docs: !function utils_point.screenspot_point_process_docs_abs
doc_to_text: !function utils_point.screenspot_point_doc_to_text_abs
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 16384
  temperature: 0.6
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Provide the point for the command:"
    post_prompt: ' Output the point in a JSON array format: [{"point_2d": [x, y]}].'
metadata:
  system_prompt_files: []
