# Vero (RL thinking checkpoint) + TRAINING-FAITHFUL ZOOM toolset on ScreenSpot-Pro.
#
# Training-faithful Vero zoom variant (mirrors visual_probe_hard_reasoning_zoom): uses
# _toolset_zoom_vero_yaml, which PASSES the training Layer-A prompt (system_vero_reasoning.txt)
# + pins the exact training tool schema. (The served step403 chat template does NOT bake Layer A,
# so it must be passed; an empty system_prompt_files would drop it.) NOTE: ScreenSpot-Pro is NOT
# in the RL training set, so this is a consistent generalization eval, NOT byte-identical to training.
#
# Answer format: point_2d (NOT computer_use - Vero was not trained on the computer_use protocol),
# scored on the 0-1000 (rel1000) scale via the qwen3 parser, which reads the [{"point_2d":[x,y]}]
# JSON from inside <answer>. This is consistent with Layer-A: the JSON lands in the <answer> block.
# Run with MODEL=vero TOOLS=on.
include:
  - _default_template_point_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "screenspotpro_point_in_box_reasoning_zoom"
test_split: train
process_docs: !function utils_point.screenspot_point_process_docs_rel1000
doc_to_text: !function utils_point.screenspot_point_doc_to_text_rel1000
# Use the qwen3 point parser: it extracts the <answer> point (tool_call point first, then
# JSON/bare-list fallback) under the rel1000 format. The default template's process_result is
# for the abs-pixel format; without this override the point would be scored in the wrong
# coordinate convention.
process_results: !function utils_point.screenspot_point_process_result_qwen3
generation_kwargs:
  until:
    - "ASSISTANT:"
  # Match the Vero RL training validation sampling (top_p/top_k explicit so vLLM doesn't fall
  # back to the checkpoint's top_k=20/top_p=0.8 defaults).
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Provide the point for the command:"
    post_prompt: ' Output the point in a JSON array format using 0-1000 image coordinates: [{"point_2d": [x, y]}].'
metadata:
  image_indexing: training_faithful
