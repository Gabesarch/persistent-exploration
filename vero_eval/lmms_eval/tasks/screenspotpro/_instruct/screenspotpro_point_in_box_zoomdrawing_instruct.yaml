group: screenspotpro_point_in_box
include:
- ../_default_template_point_yaml
- ../../_tool_templates/_instruct/_toolset_zoomdraw_instruct_yaml
task: "screenspotpro_point_in_box_zoomdrawing_instruct"
test_split: train
process_docs: !function ../utils_point.screenspot_point_process_docs_rel1000
doc_to_text: !function ../utils_point.screenspot_point_doc_to_text_qwen3_tool
process_results: !function ../utils_point.screenspot_point_process_result_qwen3
generation_kwargs:
  until:
  - "ASSISTANT:"
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    tool_prompt_template: |-
      You may call one or more functions to assist with the user query.

      You are provided with function signatures within <tools></tools> XML tags:
      <tools>
      {"type": "function", "function": {"name": "computer_use", "description": "Use a mouse to interact with a computer.\n* The screen's resolution is 1000x1000.\n* Make sure to click any buttons, links, icons, etc with the cursor tip in the center of the element. Don't click boxes on their edges unless asked.\n* you can only use the left_click and mouse_move action to interact with the computer. if you can't find the element, you should terminate the task and report the failure.", "parameters": {"properties": {"action": {"description": "The action to perform. The available actions are:\n* `mouse_move`: Move the cursor to a specified (x, y) pixel coordinate on the screen.\n* `left_click`: Click the left mouse button with coordinate (x, y).\n* `terminate`: Terminate the current task and report its completion status.", "enum": ["mouse_move", "left_click"], "type": "string"}, "coordinate": {"description": "(x, y): The x (pixels from the left edge) and y (pixels from the top edge) coordinates to move the mouse to. Required only by `action=mouse_move` and `action=left_click`.", "type": "array"}, "status": {"description": "The status of the task. Required only by `action=terminate`.", "type": "string", "enum": ["success", "failure"]}}, "required": ["action"], "type": "object"}}}
      </tools>

      For each function call, return a json object with function name and arguments within <tool_call></tool_call> XML tags:
      <tool_call>
      {"name": <function-name>, "arguments": <args-json-object>}
      </tool_call>

      After using any tools, put your final click point only inside <answer>...</answer>. Inside <answer>, return only one JSON array: [{"point_2d": [x, y]}]. Coordinates must be scaled to 1000 relative to the original image img_idx=0, not any zoomed crop.
