# Fixed 500-example public Challenge-Lite subset of ScreenSpot-Pro.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: gsarch/ScreenSpot-Pro-Lite
task: "screenspotpro_point_in_box_lite_reasoning_zoom"
test_split: test
tag:
  - screenspotpro_lite
  - visual_search
output_type: generate_until
doc_to_visual: !function utils_point.screenspot_point_doc_to_visual
process_docs: !function utils_point.screenspot_point_process_docs_rel1000
doc_to_text: !function utils_point.screenspot_point_doc_to_text_rel1000
doc_to_target: !function utils_point.screenspot_point_doc_to_target
process_results: !function utils_point.screenspot_point_process_result_qwen3
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: true
metric_list:
  - metric: screenspot_PointInBox_ACC
    aggregation: !function utils_point.screenspot_point_in_box_acc
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Provide the point for the command:"
    post_prompt: "Use coordinates relative to the original full image: x and y must each be normalized to the 0-1000 range. In the <answer> block, output only this JSON array: [{\"point_2d\": [x, y]}].\n\n\n\n"
metadata:
  version: 1.0
  description: "Fixed 500-example ScreenSpot-Pro Challenge-Lite subset"
  image_indexing: training_faithful
