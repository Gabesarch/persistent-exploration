# Vero (RL thinking checkpoint) + ZOOM on HR-Bench 4K — same tool/prompt contract as visual_probe_*_reasoning_zoom.
include:
  - hrbench_4k.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "hrbench_4k_reasoning_zoom"
tag: visual_search
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
    strip_answer_instruction: true
metadata:
  image_indexing: training_faithful
