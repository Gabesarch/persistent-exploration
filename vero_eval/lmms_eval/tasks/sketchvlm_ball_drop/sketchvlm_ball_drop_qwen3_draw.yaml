# Qwen3-VL Instruct + the DRAWING toolset on the SketchVLM ball-drop task.
# Same composition as the zoom variant but includes the draw toolset template
# (metadata.allowed_tools = draw_* ; system_base + system_draw). Drawing lets the
# model annotate the ball's traced path / ramps before committing. Run TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_draw_yaml
task: "sketchvlm_ball_drop_qwen3_draw"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
    prompt_version: "v4"
