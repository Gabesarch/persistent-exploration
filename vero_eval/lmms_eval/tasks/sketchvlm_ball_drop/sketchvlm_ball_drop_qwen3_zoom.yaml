# Qwen3-VL Instruct + the ZOOMING toolset on the SketchVLM ball-drop task.
# Modular composition: dataset template + reusable zoom toolset template. The
# toolset template contributes metadata.allowed_tools (image_zoom_in_tool) and
# metadata.system_prompt_files (system_base + system_zoom), deep-merged with the
# dataset template's metadata.version. prompt_version v4 gives balanced physics
# while the toolset system prompt drives inspect-then-answer. Run with TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "sketchvlm_ball_drop_qwen3_zoom"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
    prompt_version: "v4"
