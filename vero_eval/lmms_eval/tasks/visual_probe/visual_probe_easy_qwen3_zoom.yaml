# Qwen3-VL Instruct zero-shot + the ZOOMING toolset (multi-turn tool calling).
# Base Qwen3-VL-Instruct multi-turn zoom variant of visual_probe_easy (reuses
# _toolset_zoom_yaml; instruct model, no forced <think>; baseline vs the Vero
# _reasoning_zoom). Modular composition: dataset template + reusable zoom toolset
# template. The toolset template contributes metadata.allowed_tools
# (image_zoom_in_tool) and metadata.system_prompt_files (system_base +
# system_zoom), deep-merged with the dataset template's metadata.version. Run
# with TOOLS=on.
include:
  - visual_probe_easy.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "visual_probe_easy_qwen3_zoom"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "You are given an image. Search the picture to answer the question. Your final answer should be a short, specific phrase. "
    post_prompt: ""
