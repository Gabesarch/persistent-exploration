# STRICT-JUDGE variant of the canonical visual_probe_hard_reasoning_zoom task.
# Identical rollout config (training-faithful input + qwen3 gen-config sampling —
# see the canonical yaml's header for the full protocol); the ONLY difference is
# the judge: prompts/judge_prompt_strict.txt = the lenient rubric PLUS the
# absence-claim rule (a model answer claiming the target is absent/unobservable
# while the reference asserts a visible fact is incorrect unless it still states
# the reference's fact). Strict scores read LOWER than the lenient metric —
# never compare across the two variants.
include:
  - visual_probe_hard.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "visual_probe_hard_reasoning_zoom_strict"
tag: visual_search
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: True
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.visual_probe_aggregate_judge_results_strict
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  image_indexing: training_faithful
