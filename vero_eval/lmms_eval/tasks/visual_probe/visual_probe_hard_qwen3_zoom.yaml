# Qwen3-VL Instruct zero-shot + the ZOOMING toolset (multi-turn tool calling).
# Modular composition: dataset template + reusable zoom toolset template. The
# toolset template contributes metadata.allowed_tools (image_zoom_in_tool) and
# metadata.system_prompt_files (system_base + system_zoom), deep-merged with the
# dataset template's metadata.version. Run with TOOLS=on.
include:
  - visual_probe_hard.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "visual_probe_hard_qwen3_zoom"
generation_kwargs:
  # The base model's own generation_config defaults (temp 0.7 / top_p 0.8 / top_k 20)
  # — which the RL checkpoint inherited, so base-vs-trained comparisons are sampling-
  # matched AND native for both. (Replaces the earlier ad-hoc 1.0/1.0/40/presence 2.0.)
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "You are given an image. Search the picture to answer the question. Your final answer should be a short, specific phrase. "
    post_prompt: ""
