# Training-faithful Vero DRAWING eval on VisualProbe-Hard.
# Same training-faithful setup as the zoom variant. NOTE: there is no draw RL training run yet, so
# this is "Vero on draw" rather than a byte-faithful replication; the sampling + Layer-A prompt match
# the Vero validation setup. (No image_indexing knob: it only governs the zoom tool-response.)
include:
- ../visual_probe_hard.yaml
- ../../_tool_templates/_vero/_toolset_draw_vero_yaml
task: "visual_probe_hard_drawing_vero"
generation_kwargs:
  # Match Vero validation sampling. top_p/top_k MUST be explicit (else vLLM uses the checkpoint's
  # generation_config defaults top_k=20/top_p=0.8).
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "\n"
    post_prompt: ""
