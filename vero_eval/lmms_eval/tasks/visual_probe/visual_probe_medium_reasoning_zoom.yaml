# Training-faithful Vero ZOOM variant of visual_probe_medium.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool,
# with training sampling + the training-faithful zoom toolset). Same dataset wiring as
# visual_probe_medium_reasoning, but adds the Vero zoom toolset, training-faithful sampling,
# and image_indexing.
#
# NOTE ON FAITHFULNESS: the byte-identical-to-training replication is verified only for the
# visual_probe (Hard) checkpoint data; for VisualProbe_Medium this is a consistent
# GENERALIZATION eval (same input style / toolset / sampling), NOT byte-identical to training.
#
# Layer A (system_vero_reasoning.txt) always answers as <answer> ... </answer>, with a LaTeX
# \boxed{} for definitive concise answers. The empty pre/post prompts below do not fight that.
#
# Run with MODEL=vero TOOLS=on.
include:
  - visual_probe_medium.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "visual_probe_medium_reasoning_zoom"
tag: visual_search
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    # Training's user turn is "<image>\n{question}", which decodes to "user\n\n{question}".
    # The served chat template emits no newline after the image, so that separator newline
    # must live in the text. pre_prompt "\n" reproduces training's user turn byte-for-byte.
    # It does NOT add a final-answer instruction.
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  image_indexing: training_faithful
