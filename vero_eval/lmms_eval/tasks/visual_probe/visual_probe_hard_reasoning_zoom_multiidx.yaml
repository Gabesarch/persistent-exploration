# Vero (RL thinking checkpoint) + ZOOM on VisualProbe-Hard — training-aligned alias.
#
# Kept for compatibility with any runner that names the old multiidx task, but it now
# intentionally matches visual_probe_hard_reasoning_zoom instead of adding the extra
# "The cropped view is now available as img_idx N." tool-response tokens. This keeps
# every post-tool prompt aligned with the training tool response.
include:
  - visual_probe_hard.yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
task: "visual_probe_hard_reasoning_zoom_multiidx"
tag: visual_search
generation_kwargs:
  max_new_tokens: 24576
  temperature: 0.7
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    # Same training-faithful user turn as the replication task (see that file): pre_prompt
    # "\n" reproduces training's "user\n\n{question}" byte-for-byte. Turn-1 input is identical
    # to training.
    pre_prompt: "\n"
    post_prompt: ""
metadata:
  image_indexing: training_faithful
