# Base Qwen3-VL-Instruct multi-turn ZOOM variant of cv_bench.
#
# Reuses the generic zoom toolset (_toolset_zoom_yaml -> allowed_tools=[image_zoom_in_tool]
# + system_base/system_zoom prompts), evaluating the INSTRUCT (non-think) base model with
# multi-turn tool use. No forced <think>, no Layer-A: this is the baseline counterpart to the
# Vero cv_bench_reasoning_zoom. Keeps cv_bench's dataset wiring / scorer and the qwen3 zero-shot
# sampling (from cv_bench_qwen3_zs) verbatim. Run with TOOLS=on.
dataset_path: nyu-visionx/CV-Bench
dataset_name: "default"
task: "cv_bench_qwen3_zoom"
test_split: test
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
process_results: !function utils.cv_bench_process_results
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Your final answer should be the option letter from the options above."
