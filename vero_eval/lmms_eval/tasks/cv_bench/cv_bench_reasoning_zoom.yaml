# Training-faithful Vero ZOOM variant of cv_bench.
#
# Mirrors visual_probe_hard_reasoning_zoom (the confirmed-correct reference): it adds
# the Vero zoom toolset (_toolset_zoom_vero_yaml -> image_zoom_in_tool, training Layer-A
# system prompt, pinned tool schema) plus training-faithful sampling and
# image_indexing: training_faithful, while keeping cv_bench's dataset wiring / scorer
# (from _default_template_yaml + utils.py) byte-identical to cv_bench_reasoning.
#
# IMPORTANT: this is BYTE-FAITHFUL only for visual_probe (the dataset the Vero checkpoint
# was actually RL-trained on). For cv_bench this is a CONSISTENT GENERALIZATION eval that
# reproduces the training INPUT STYLE (tool schema, system prompt, sampling), NOT a
# byte-identical replay of any training example. Run with MODEL=vero TOOLS=on.
dataset_path: nyu-visionx/CV-Bench
dataset_name: "default"
task: "cv_bench_reasoning_zoom"
test_split: test
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  image_indexing: training_faithful
