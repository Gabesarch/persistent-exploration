# Base Qwen3-VL-Instruct multi-turn ZOOM variant of erqa.
#
# Reuses the generic _toolset_zoom_yaml (allowed_tools=[image_zoom_in_tool] +
# system_base/system_zoom prompts) for instruct-style multi-turn tool use.
# This is the INSTRUCT (non-think) base model: NO forced <think>, NO Layer-A.
# It is the baseline counterpart to the Vero erqa_reasoning_zoom checkpoint eval.
#
# Dataset wiring (dataset_path / process_results / scorer / question format) is
# inherited unchanged from _default_template_yaml + the source erqa_qwen3_zs.yaml.
# qwen3 sampling is kept verbatim from the source. Run with TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
dataset_name: null
test_split: test
task: "erqa_qwen3_zoom"
process_results: !function utils.erqa_process_results
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Your final answer should be the option letter from the options above."
