# Training-faithful Vero ZOOM variant of simplevqa_en.
#
# Mirrors visual_probe_hard_reasoning_zoom (vero toolset + training sampling): same
# Layer-A system prompt, EXACT training image_zoom_in_tool schema, and the training
# validation sampling (temperature 0.7, top_p 1.0, top_k -1), with image_indexing:
# training_faithful.
#
# NOTE: BYTE-FAITHFUL replication of the RL training input is only guaranteed for the
# visual_probe dataset (the checkpoint's training source). For simplevqa this is a
# consistent GENERALIZATION eval that reuses the same Vero zoom tooling/sampling, NOT a
# byte-identical reproduction of training. Run with MODEL=vero TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: gsarch/SimpleVQA-EN
dataset_name: "default"
task: "simplevqa_en_reasoning_zoom"
test_split: test
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0,
  # top_k -1). top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the
  # checkpoint's generation_config defaults (top_k=20, top_p=0.8), which diverges from
  # training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  image_indexing: training_faithful
