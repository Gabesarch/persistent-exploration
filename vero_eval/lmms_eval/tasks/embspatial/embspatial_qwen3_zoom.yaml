# Base Qwen3-VL-Instruct multi-turn ZOOM variant of embspatial.
#
# Reuses the generic zoom toolset (_toolset_zoom_yaml): instruct (non-think)
# model with multi-turn tool calling, NO forced <think>, NO Layer-A. This is
# the baseline counterpart to the Vero embspatial_reasoning_zoom checkpoint eval.
#
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs:
# same dataset wiring + qwen3 sampling as embspatial_qwen3_zs, plus the zoom
# toolset. The toolset template contributes metadata.allowed_tools
# (image_zoom_in_tool) and metadata.system_prompt_files (system_base +
# system_zoom), deep-merged with this task's metadata. Run with TOOLS=on.
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
dataset_name: null
test_split: test
task: "embspatial_qwen3_zoom"
process_results: !function utils.embspatial_process_results
generation_kwargs:
  # qwen3 instruct sampling from embspatial_qwen3_zs; max_new_tokens raised to
  # 16384 to leave room for multi-turn tool calls (mirrors the zoom reference).
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # Softened from "Please answer with ..." to a non-suppressing form so the
    # final-answer instruction does not discourage tool use during the turn.
    post_prompt: "Your final answer should be the option letter from the options above."
