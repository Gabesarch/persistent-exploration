# Training-faithful Vero ZOOM variant of mathvision_test.
#
# Mirrors visual_probe_hard_reasoning_zoom (Vero RL thinking checkpoint + image_zoom_in_tool):
# adds the Vero zoom toolset (_toolset_zoom_vero_yaml: Layer-A system prompt + EXACT training
# tool schema), training-faithful sampling (temperature 0.7, top_p 1.0, top_k -1), and
# image_indexing: training_faithful. Run with MODEL=vero TOOLS=on.
#
# NOTE: this is BYTE-FAITHFUL to RL training ONLY for visual_probe. For MathVision it is a
# consistent GENERALIZATION eval (same Vero toolset / sampling / answer protocol), NOT
# byte-identical to training. The dataset wiring (dataset_path / doc_to_* / process_results /
# metric_list / scorer) is kept EXACTLY as mathvision_test_reasoning.yaml.
include:
  - ../_tool_templates/_toolset_zoom_vero_yaml
dataset_path: MathLLMs/MathVision
dataset_kwargs:
  token: True
task: "mathvision_test_reasoning_zoom"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mathvision_doc_to_visual
doc_to_text: !function utils.mathvision_doc_to_text_custom
doc_to_target: "answer"
generation_kwargs:
  # Matches the RL training validation sampling exactly (temperature 0.7, top_p 1.0, top_k -1).
  # top_p/top_k MUST be set explicitly: if omitted, vLLM falls back to the checkpoint's
  # generation_config defaults (top_k=20, top_p=0.8), which diverges from training.
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
process_results: !function utils.mathvision_process_results
metric_list:
  - metric: mathvision_standard_eval
    aggregation: !function utils.mathvision_aggregate_results_eval
    higher_is_better: true

metadata:
  version: 0.0
  image_indexing: training_faithful

lmms_eval_specific_kwargs:
  default:
    prompt_format: solution
    mc_prompt: ""
    short_answer_prompt: ""
