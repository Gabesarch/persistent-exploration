# Base Qwen3-VL-Instruct multi-turn ZOOM variant of mathvision_test.
# Reuses the generic _toolset_zoom_yaml (allowed_tools=[image_zoom_in_tool] +
# system_base/system_zoom prompts): instruct model, multi-turn tool use, NO forced
# <think>, NO Layer-A. Baseline counterpart to the Vero _reasoning_zoom checkpoint.
#
# Dataset wiring + qwen3 sampling are inherited verbatim from
# mathvision_test_qwen3_zs.yaml; only the zoom toolset is layered on. Run with TOOLS=on.
include:
  - mathvision_test_qwen3_zs.yaml
  - ../_tool_templates/_toolset_zoom_yaml
task: "mathvision_test_qwen3_zoom"
dataset_path: MathLLMs/MathVision
dataset_kwargs:
  token: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mathvision_doc_to_visual
doc_to_text: !function utils.mathvision_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
process_results: !function utils.mathvision_process_results
metric_list:
  - metric: mathvision_standard_eval
    aggregation: !function utils.mathvision_aggregate_results_eval
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    prompt_format: solution
    mc_prompt: ""
    short_answer_prompt: ""
