# Vero ZOOM leaf for BLINK / Functional_Correspondence (training-faithful tool-use input).
# See blink_reasoning_zoom.yaml (the group) for the full rationale. Each leaf must
# include the zoom toolset DIRECTLY: the toolset config lives under `metadata:`, and
# `metadata` is a GROUP_ONLY key in lmms_eval, so group-level metadata does NOT
# propagate to subtasks. Putting it on the leaf is what makes allowed_tools /
# system_prompt_files / tool_schema_overrides / image_indexing reach the task object.
dataset_name: "Functional_Correspondence"
tag: "blink_reasoning_zoom_groups"
task: "blink_functional_correspondence_reasoning_zoom"
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_vero_yaml
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 1.0
  top_k: -1
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  image_indexing: training_faithful
