# Base Qwen3-VL-Instruct multi-turn ZOOM leaf for BLINK / Semantic_Correspondence.
# Reuses the generic _toolset_zoom_yaml (allowed_tools=[image_zoom_in_tool] +
# system_base/system_zoom). Instruct model: NO forced <think>, NO Layer-A.
# Baseline counterpart to the Vero blink_semantic_correspondence_reasoning_zoom leaf.
#
# Dedicated leaf (not the shared blink_groups tag): the toolset config lives under
# metadata: (a GROUP_ONLY key in lmms_eval), so it does NOT propagate from a group to
# subtasks. Including the toolset on the leaf is what makes allowed_tools /
# system_prompt_files reach the task object. Run with TOOLS=on.
dataset_name: "Semantic_Correspondence"
tag: "blink_qwen3_zoom_groups"
task: "blink_semantic_correspondence_qwen3_zoom"
include:
  - _default_template_yaml
  - ../_tool_templates/_toolset_zoom_yaml
process_results: !function utils.blink_process_results
generation_kwargs:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 1.0
  top_k: 40
  presence_penalty: 2.0
  do_sample: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Please answer with the option letter from the options above."
