# Base Qwen3-VL-Instruct multi-turn ZOOM variant of blink (GROUP).
#
# Reuses the generic _toolset_zoom_yaml (allowed_tools=[image_zoom_in_tool] +
# system_base/system_zoom) for instruct multi-turn tool use: NO forced <think>,
# NO Layer-A. Baseline counterpart to the Vero blink_reasoning_zoom group.
# Mirrors how visual_probe_hard_qwen3_zoom relates to visual_probe_hard_qwen3_zs.
#
# WHY DEDICATED LEAF FILES (not the shared `blink_groups` tag):
# the zoom toolset is configured entirely under `metadata:` (allowed_tools,
# system_prompt_files). In lmms_eval, `metadata` is a GROUP_ONLY key
# (GROUP_ONLY_KEYS = [group, group_alias, task, aggregate_metric_list, metadata]),
# so a group config's metadata is retained on the GROUP and is NOT pushed down to
# subtasks. If this group reused the shared `blink_groups` leaves, every leaf task
# object would load with metadata={} -> no tools, no zoom system prompt (the eval
# would silently run as plain text generation). To make the toolset reach each task
# object, the toolset `include` lives on the per-category leaf files
# (blink_<category>_qwen3_zoom.yaml), tagged blink_qwen3_zoom_groups. This group just
# collects those leaves and aggregates blink_acc.
group: blink_qwen3_zoom
task:
  - blink_qwen3_zoom_groups
aggregate_metric_list:
  - metric: blink_acc
